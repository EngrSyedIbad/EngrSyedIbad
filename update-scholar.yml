name: Update Google Scholar data

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch Scholar data
        run: python update_scholar.py

      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "scholar-bot@users.noreply.github.com"
          git add scholar.json
          git diff --staged --quiet || (git commit -m "Update Google Scholar data" && git push)
